<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <a class="navbar-brand d-flex align-items-center" href="ProductsManagement.html">
        <img src="Images/admin.png" alt="Logo" width="50" height="50" class="me-2">
        <div class="lh-1">
          <strong>Admin Dashboard</strong><br>
          <small class="text-muted">E-Commerce Management</small>
        </div>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-center">
          <li class="nav-item ms-lg-3">
            <a class="nav-link active d-flex align-items-center" href="Dashboard.html">
              <img src="Images/orders.png" alt="Logo" width="20" height="20" class="me-2">
              <strong>Orders</strong>
            </a>
          </li>
          <li class="nav-item ms-lg-3">
            <a class="nav-link active d-flex align-items-center" href="ProductsManagement.html">
              <img src="Images/products.png" alt="Logo" width="20" height="20" class="me-2">
              <strong>Products Management</strong>
            </a>
          </li>
          <li class="nav-item ms-lg-3">
            <a class="nav-link active d-flex align-items-center" href="CategoriesManagment.html">
              <img src="Images/categories.png" alt="Logo" width="20" height="20" class="me-2">
              <strong>Categories Management</strong>
            </a>
          </li>

        </ul>

        <a class="nav-link active d-flex align-items-center me-3" href="product-add.html" id="addProduct">
          <img src="Images/add.png" alt="Logo" width="40" height="40" class="me-2">
        </a>

      <button type="button" id="logoutButton" class="btn btn-outline-danger shadow-sm" 
        style="border-radius: 6px; padding: 8px 20px; font-size: 0.95rem; font-weight: 500; transition: all 0.2s ease;">
  Sign Out
</button>
        </style>

    </div>

  <div class="container-fluid">

      <!-- Sidebar (Left) -->
      <div class="col-lg-3 col-md-4">
        <nav id="sidebarMenu" class="bg-body-tertiary sidebar position-sticky"
          style="height: calc(100vh - 56px); top: 56px;">
          <div class="list-group list-group-flush mx-3 mt-3">
            <span class="nav-section-title text-center fw-bold bg-gray">
              <h3>Categories</h3>
            </span>
            <hr>
            <div id="dynamic-sidebar" class="list-group list-group-flush mt-4">
              <!-- Categories will load here -->
            </div>
          </div>
        </nav>
      </div>

      <div class="col-lg-9 col-md-8">
        <div class="my-3">
          <h4>Add New Category</h4>
          <div class="input-group mb-3">
            <input type="text" id="newCategoryInput" class="form-control" placeholder="Enter category name">
            <button class="btn btn-primary" id="addCategoryBtn">Add Category</button>
          </div>

          <!-- Optional: Render products here -->
          <div id="products-container"></div>
        </div>
      </div>

    </div>

  <script type="module" src="CategoriesManagment.js"></script>
  <script src="data/products-data.js"></script>
  <script src="../script.js"></script>
