<!-- ================= PAGE TITLE ================= -->
<div class="container mt-5 text-center">
    <h2 class="fw-bold">Orders Management</h2>
    <p class="text-muted">Manage customer orders efficiently</p>
</div>


<!-- ================= ORDERS TABLE ================= -->
<div class="container mt-4 mb-5">
<span id="clearFinished"
      class="d-inline-flex align-items-center gap-2 text-danger mb-3"
      style="cursor: pointer;">

    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 640 640"
         width="20"
         height="20"
         fill="currentColor">
        <path d="M232.7 69.9C237.1 56.8 249.3 48 263.1 48L377 48C390.8 48 403 56.8 407.4 69.9L416 96L512 96C529.7 96 544 110.3 544 128C544 145.7 529.7 160 512 160L128 160C110.3 160 96 145.7 96 128C96 110.3 110.3 96 128 96L224 96L232.7 69.9zM128 208L512 208L512 512C512 547.3 483.3 576 448 576L192 576C156.7 576 128 547.3 128 512L128 208z"/>
    </svg>

    Clear finished
</span>

    <div class="card shadow-sm border-0 rounded-4">

        <!-- Header -->
        <div class="card-header bg-dark text-white rounded-top-4">
            <div class="row text-center fw-semibold">
                <div class="col-md-3">Order ID</div>
                <div class="col-md-3">Customer Email</div>
                <div class="col-md-3">Total Price</div>
                <div class="col-md-3">Action</div>
            </div>
        </div>

        <!-- Orders Container -->
        <div class="card-body p-0">

            <div id="orders-div" class="overflow-auto" style="max-height:400px; display:none;">
                <!-- JS Will Insert Orders Here -->
            </div>

            <!-- Empty State -->
            <div id="empty-div"
                class="d-flex justify-content-center align-items-center text-center fw-semibold py-5"
                style="display:none;">
                There are no orders yet!
            </div>

        </div>

    </div>

</div>


<!-- ================= SCRIPTS ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="Dashboard.js"></script>
<script src="logout.js"></script>

</body>
</html>
