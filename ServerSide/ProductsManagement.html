<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }

        /* Navbar */
        .navbar-brand strong {
            font-size: 1.1rem;
        }

        .navbar small {
            font-size: 0.75rem;
        }

        /* Cards */
        .product-card {
            width: 260px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .product-card img {
            height: 170px;
            object-fit: cover;
            border-radius: 12px;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: bold;
            color: #0d6efd;
        }

        /* Buttons */
        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.8rem;
        }

        .btn-edit {
            background-color: #0d6efd;
            border: none;
        }

        .btn-edit:hover {
            background-color: #0b5ed7;
        }

        .btn-remove {
            background-color: #dc3545;
            border: none;
        }

        .btn-remove:hover {
            background-color: #bb2d3b;
        }

        .add-btn img {
            transition: 0.2s;
        }

        .add-btn:hover img {
            transform: scale(1.1);
        }

        .no-caret::after {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="ProductsManagement.html">
                <img src="Images/admin.png" width="45" height="45" class="me-2">
                <div class="lh-1">
                    <strong>Admin Dashboard</strong><br>
                    <small class="text-muted">E-Commerce Management</small>
                </div>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <ul class="navbar-nav me-auto align-items-lg-center">
                    <li class="nav-item ms-lg-3">
                        <a class="nav-link active" href="Dashboard.html">
                            Orders
                        </a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="nav-link active fw-bold text-primary" href="ProductsManagement.html">
                            Products
                        </a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="nav-link active" href="CategoriesManagment.html">
                            Categories
                        </a>
                    </li>
                </ul>

                <!-- Add Product -->
                <a href="product-add.html" class="add-btn me-3">
                    <img src="Images/add.png" width="40" height="40">
                </a>

                <!-- Profile Dropdown -->
                <div class="dropdown">
                    <button class="btn rounded-circle no-caret"
                        style="background-color:#ff6b6b; padding:10px;"
                        data-bs-toggle="dropdown">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="white"
                            viewBox="0 0 640 640" width="30" height="30">
                            <path
                                d="M320 312C386.3 312 440 258.3 440 192C440 125.7 386.3 72 320 72C253.7 72 200 125.7 200 192C200 258.3 253.7 312 320 312zM290.3 368C191.8 368 112 447.8 112 546.3C112 562.7 125.3 576 141.7 576L498.3 576C514.7 576 528 562.7 528 546.3C528 447.8 448.2 368 349.7 368L290.3 368z" />
                        </svg>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <button id="logoutButton" class="dropdown-item text-danger">
                                Sign Out
                            </button>
                        </li>
                    </ul>
                </div>

            </div>
        </div>
    </nav>

    <!-- ================= PRODUCTS ================= -->
    <div class="container py-4">
        <div id="products"
            class="d-flex flex-wrap justify-content-center gap-4">
        </div>
    </div>


    <!-- Scripts -->
    <script src="data/products-data.js"></script>
    <script src="../script.js"></script>
    <script src="logout.js"></script>
    <script src="ProductsManagment.js"></script>

</body>

</html>
