<div class="container cart-wrapper">

    <!-- Breadcrumb -->
    <div class="mb-4">
        <h3 class="fw-bold">Shopping Cart</h3>
        <p class="text-muted">Review your items before checkout</p>
    </div>

    <div class="row g-4">

        <!-- ================= CART ITEMS ================= -->
        <div class="col-lg-8">

            <div class="cart-card">

                <div class="cart-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Your Cart</h5>
                    <span id="clearCart" class="clear-btn">
                        Clear Cart
                    </span>
                </div>

                <!-- Column Labels -->
                <div class="cart-labels row text-muted fw-semibold">
                    <div class="col-md-4">Product</div>
                    <div class="col-md-3 text-center">Quantity</div>
                    <div class="col-md-2 text-center">Price</div>
                    <div class="col-md-2 text-center">Subtotal</div>
                    <div class="col-md-1"></div>
                </div>

                <!-- Cart Items -->
                <div id="full-div" class="cart-items overflow-auto" style="display:none; height:400px;">
                    <!-- JS template row still used -->
                    <div class="row cart-item align-items-center">
                        <div class="col-md-4 d-flex align-items-center gap-3" id="item-img">
                            <img src="" width="70" height="70">
                            <div>
                                <div id="item-title" class="fw-semibold"></div>
                                <small id="item-subTitle" class="text-muted"></small>
                            </div>
                        </div>

                        <div class="col-md-3 text-center">
                            <div class="input-group quantity-box">
                                <button class="btn btn-outline-secondary" id="btn-minus">-</button>
                                <input type="text" id="qty" class="form-control text-center" value="1">
                                <button class="btn btn-outline-secondary" id="btn-plus">+</button>
                            </div>
                        </div>

                        <div class="col-md-2 text-center fw-semibold" id="item-price"></div>
                        <div class="col-md-2 text-center text-primary fw-bold" id="subTotalPrice"></div>

                        <div class="col-md-1 text-center text-danger" id="deleteProduct">
                            ✕
                        </div>
                    </div>
                </div>

                <div id="empty-div" class="empty-cart d-flex flex-column justify-content-center align-items-center text-center py-5 " style="display:none;">
                    <h5>Your cart is empty </h5>
                </div>

            </div>
        </div>


        <!-- ================= ORDER SUMMARY ================= -->
        <div class="col-lg-4">

            <div class="summary-card">

                <h5 class="fw-bold mb-4">Order Summary</h5>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subTotal">$0.00</span>
                </div>

                <div class="summary-row">
                    <span>Shipping</span>
                    <span id="EstimatedShipping">$0.00</span>
                </div>

                <div class="summary-row">
                    <span>Tax</span>
                    <span id="EstimatedTax">$0.00</span>
                </div>

                <hr>

                <div class="summary-row total">
                    <span>Total</span>
                    <span id="EstimatedTax">$0.00</span>
                </div>

                <a href="#" id="submit-order" class="btn btn-dark w-100 mt-4">
                    Checkout
                </a>

                <div class="discount-box mt-4">
                    <form role="apply-discount" class="d-flex mt-2">
                       
                    </form>
                </div>

            </div>
        </div>

    </div>
</div>
