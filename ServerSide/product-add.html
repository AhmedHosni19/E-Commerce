    <div class="container my-5">

  <!-- Page Title -->
  <div class="text-center mb-4">
    <h1 id="Ptitle" class="fw-bold"></h1>
    <p class="text-muted">Fill in the product details below</p>
  </div>

  <!-- Form Card -->
  <div class="card shadow-sm border-0 rounded-4 p-4">

    <!-- Image Upload -->
    <div class="mb-4">
      <label for="formFileLg" class="form-label fw-semibold">
        Upload Product Image
      </label>
      <input class="form-control form-control-lg" id="formFileLg" type="file">
    </div>

    <!-- Product Title -->
    <div class="mb-4">
      <label class="form-label fw-semibold">Product Title</label>
      <input
        type="text"
        id="title"
        class="form-control form-control-lg"
        placeholder="Enter product title">
    </div>

    <!-- Product Subtitle -->
    <div class="mb-4">
      <label class="form-label fw-semibold">Product Subtitle</label>
      <input
        type="text"
        id="subTitle"
        class="form-control form-control-lg"
        placeholder="Enter product subtitle">
    </div>

    <!-- Category -->
    <div class="mb-4">
      <label class="form-label fw-semibold">Category</label>
      <select
        name="Category"
        id="category-select"
        class="form-select form-select-lg">
        <option value="" selected>-- Select The Category --</option>
      </select>
    </div>

    <!-- Price -->
    <div class="mb-4">
      <label class="form-label fw-semibold">Product Price</label>
      <input
        type="number"
        id="price"
        class="form-control form-control-lg"
        placeholder="0.00">
    </div>
<div class="mb-3">
  <label for="stock" class="form-label">Stock Quantity</label>
  <input type="number" class="form-control" id="stock" min="0" value="0" required>
</div>
    <!-- Description -->
    <div class="mb-4">
      <label class="form-label fw-semibold">Product Description</label>
      <textarea
        id="description"
        class="form-control form-control-lg"
        rows="4"
        placeholder="Write a short description..."></textarea>
    </div>

    <!-- Submit -->
    <div class="d-flex justify-content-end">
      <button
        type="submit"
        id="submitBtn"
        class="btn btn-primary btn-lg px-5">
        Save Product
      </button>
    </div>

  </div>
</div>


    <script src="data/products-data.js"></script>

    <script src="ProductsManagment.js"></script>
    <script src="../script.js"></script>

</body>
